name: CI Unit Tests

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run JVM & Android Media3 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Run media-jvm unit tests
        run: ./gradlew :media-jvm:test --no-daemon --no-configuration-cache

      - name: Run Android Media3 unit tests
        run: ./gradlew :media3:testDebugUnitTest --no-daemon --no-configuration-cache

      - name: Run data JVM unit tests
        run: ./gradlew :data:jvmTest --no-daemon --no-configuration-cache

      - name: Run composeApp JVM unit tests
        run: ./gradlew :composeApp:jvmTest --no-daemon --no-configuration-cache
