name: Build & Test iOS IPA with terminal-phone

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  ios-terminal-phone:
    name: Build iPhone IPA & Verify with govijr/terminal-phone
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS App, IPA & Run terminal-phone E2E Tests
        env:
          SIMPMUSIC_VERSION: "2.6.13"
        run: |
          chmod +x scripts/ios/build-and-test-ios.sh
          bash scripts/ios/build-and-test-ios.sh

      - name: Upload iOS IPA & terminal-phone Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-HeyJarvis-iOS-v2.6.13
          path: |
            dist/ios/SimpMusic-HeyJarvis-v2.6.13-iOS.ipa
            dist/ios/SimpMusic-HeyJarvis-v2.6.13-iOS-Simulator.app.zip
            dist/ios/SimpMusic-HeyJarvis-OneClick.mobileconfig
            dist/ios/SimpMusic-HeyJarvis-iOS-OneClick-Installer.html
            dist/ios/manifest.plist
            dist/ios/SimpMusic-HeyJarvis-v2.6.13-iOS-TerminalPhone-TestReport.zip
            dist/ios/terminal-phone-results/**

      - name: Attach iOS IPA & One-Click Installer to Latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(gh release view --json tagName -q .tagName 2>/dev/null || echo 'v2.6.12-heyjarvis')"
          echo "Uploading iOS artifacts to release $TAG..."
          gh release upload "$TAG" \
            dist/ios/SimpMusic-HeyJarvis-v2.6.13-iOS.ipa \
            dist/ios/SimpMusic-HeyJarvis-v2.6.13-iOS-Simulator.app.zip \
            dist/ios/SimpMusic-HeyJarvis-OneClick.mobileconfig \
            dist/ios/SimpMusic-HeyJarvis-iOS-OneClick-Installer.html \
            dist/ios/manifest.plist \
            dist/ios/SimpMusic-HeyJarvis-v2.6.13-iOS-TerminalPhone-TestReport.zip \
            --clobber
