name: Build Real KMP ComposeApp iOS Framework

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "composeApp/**"
      - "core/**"
      - "iosApp/KmpHost/**"
      - "scripts/ios/**"
      - ".github/workflows/ios-kmp-framework.yml"

permissions:
  contents: write

jobs:
  build-kmp-ios:
    name: Build 1-to-1 KMP ComposeApp iPhone IPA & Verify with terminal-phone
    runs-on: macos-15
    steps:
      - name: Checkout repository (with core submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Select Xcode 16 (iOS 18 SDK for Appetize & iOS 17/18 compatibility)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Patch core/ commonMain for Kotlin/Native iOS
        run: |
          chmod +x scripts/ios/patch-core-for-ios.sh
          bash scripts/ios/patch-core-for-ios.sh

      - name: Compile Real ComposeApp Framework (Fast Simulator Build)
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon --no-configuration-cache -Pkotlin.native.cacheKind=none -Dorg.gradle.jvmargs="-Xmx8g -XX:MaxMetaspaceSize=1g" -Pkotlin.native.jvmArgs="-Xmx8g"

      - name: Package Real KMP Simulator .app
        run: |
          set -euo pipefail
          mkdir -p dist/ios-kmp/results build/kmp-sim/SimpMusic.app

          SIM_FW="composeApp/build/bin/iosSimulatorArm64/debugFramework"
          SIM_SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"

          # Build AppIcon.appiconset from composeApp/icon/circle_app_icon.png
          ICON_SRC="composeApp/icon/circle_app_icon.png"
          if [ -f "$ICON_SRC" ]; then
            mkdir -p build/Assets.xcassets/AppIcon.appiconset build/icon-out
            sips -z 1024 1024 "$ICON_SRC" --out build/Assets.xcassets/AppIcon.appiconset/icon-1024.png >/dev/null
            sips -z 180 180 "$ICON_SRC" --out build/Assets.xcassets/AppIcon.appiconset/icon-180.png >/dev/null
            sips -z 120 120 "$ICON_SRC" --out build/Assets.xcassets/AppIcon.appiconset/icon-120.png >/dev/null
            cat > build/Assets.xcassets/AppIcon.appiconset/Contents.json << 'EOF'
          {
            "images": [
              {"filename": "icon-120.png", "idiom": "iphone", "scale": "2x", "size": "60x60"},
              {"filename": "icon-180.png", "idiom": "iphone", "scale": "3x", "size": "60x60"},
              {"filename": "icon-1024.png", "idiom": "ios-marketing", "scale": "1x", "size": "1024x1024"}
            ],
            "info": {"author": "xcode", "version": 1}
          }
          EOF
            xcrun actool build/Assets.xcassets --compile build/icon-out \
              --platform iphoneos --minimum-deployment-target 16.0 \
              --app-icon AppIcon --output-partial-info-plist build/icon-out/partial.plist >/dev/null || true
          fi

          # Build Simulator .app linking real ComposeApp.framework
          xcrun --sdk iphonesimulator swiftc -parse-as-library \
            -sdk "$SIM_SDK" \
            -target "arm64-apple-ios17.0-simulator" \
            -F "$SIM_FW" \
            -framework ComposeApp \
            -framework AVFoundation -framework AVFAudio -framework MediaPlayer \
            -framework Metal -framework CoreMedia -framework QuartzCore -framework UIKit \
            -Xlinker -dead_strip -Xlinker -lsqlite3 -Xlinker -lc++ \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            iosApp/KmpHost/SimpMusicKmpApp.swift \
            -o build/kmp-sim/SimpMusic.app/SimpMusic
          cp iosApp/Info.plist build/kmp-sim/SimpMusic.app/Info.plist
          if [ -f build/icon-out/Assets.car ]; then
            cp build/icon-out/Assets.car build/kmp-sim/SimpMusic.app/
            cp build/icon-out/AppIcon*.png build/kmp-sim/SimpMusic.app/ 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Merge build/icon-out/partial.plist" build/kmp-sim/SimpMusic.app/Info.plist 2>/dev/null || true
          fi
          cp -R composeApp/build/compose/ios/composeApp/compose-resources build/kmp-sim/SimpMusic.app/ 2>/dev/null || true
          codesign --force --sign - build/kmp-sim/SimpMusic.app
          (cd build/kmp-sim && zip -qry ../../dist/ios-kmp/SimpMusic-HeyJarvis-v2.6.13-iOS-Simulator.app.zip SimpMusic.app)
          ls -lh dist/ios-kmp/

      - name: Upload Real KMP iOS Simulator Build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-Real-KMP-iOS-v2.6.13
          path: dist/ios-kmp/**

      - name: Attach Real KMP iOS IPA to Latest GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(gh release view --json tagName -q .tagName 2>/dev/null || echo 'v2.6.12-heyjarvis')"
          gh release upload "$TAG" \
            dist/ios-kmp/SimpMusic-HeyJarvis-v2.6.13-iOS.ipa \
            dist/ios-kmp/SimpMusic-HeyJarvis-v2.6.13-iOS-Simulator.app.zip \
            --clobber || true
