name: Build Real KMP ComposeApp iOS Framework

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "composeApp/**"
      - "core/**"
      - ".github/workflows/ios-kmp-framework.yml"

jobs:
  build-kmp-ios:
    name: Compile Real composeApp to iOS Framework (iosSimulatorArm64)
    runs-on: macos-26
    steps:
      - name: Checkout repository (with core submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Patch core/ commonMain Dispatchers.IO for Kotlin/Native iOS
        run: |
          chmod +x scripts/ios/patch-core-for-ios.sh
          bash scripts/ios/patch-core-for-ios.sh

      - name: Compile ComposeApp iOS Simulator Framework
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon --no-configuration-cache --stacktrace --continue
