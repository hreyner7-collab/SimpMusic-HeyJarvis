<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SimpMusic" />
  <title>SimpMusic</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #141416;
      --surface2: #1C1C1E;
      --surface3: #2C2C2E;
      --accent: #FA233B;
      --accent-soft: rgba(250, 35, 59, 0.18);
      --text: #FFFFFF;
      --muted: #8E8E93;
      --border: rgba(255, 255, 255, 0.09);
      --glass: rgba(28, 28, 30, 0.86);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      background: var(--bg);
    }
    /* Top App Bar — matches SimpMusic Android HomeScreen top bar */
    .top-bar {
      padding: calc(env(safe-area-inset-top, 10px) + 12px) 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 10;
    }
    .greeting-wrap { display: flex; flex-direction: column; }
    .greeting-sub { font-size: 12px; color: var(--muted); font-weight: 500; }
    .greeting-title { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-top: 1px; }
    .top-icons { display: flex; align-items: center; gap: 8px; }
    .icon-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-circle svg { width: 19px; height: 19px; fill: currentColor; }
    .jarvis-orb {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1.5px solid rgba(250, 35, 59, 0.7);
      background: radial-gradient(circle at 30% 30%, #FA233B, #a855f7 65%, #38bdf8);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(250, 35, 59, 0.4);
    }
    .jarvis-orb svg { width: 18px; height: 18px; fill: #fff; }
    .jarvis-orb.listening { animation: pulse 1s infinite; }
    @keyframes pulse {
      0%,100% { transform: scale(1); box-shadow: 0 0 16px rgba(250,35,59,0.5); }
      50% { transform: scale(1.1); box-shadow: 0 0 26px rgba(250,35,59,0.9); }
    }

    /* Main Scroll Area */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 170px;
      -webkit-overflow-scrolling: touch;
    }
    .content::-webkit-scrollbar { display: none; }

    /* Mood Chips — exact Android SimpMusic moods */
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 14px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      padding: 8px 15px;
      border-radius: 999px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.active {
      background: var(--text);
      color: #000000;
      border-color: var(--text);
    }

    /* Section Headers */
    .sec-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 16px 0 10px;
    }
    .sec-title { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
    .sec-sub { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
    .sec-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Quick Picks — 4-row horizontal snap grid like Android SimpMusic */
    .qp-grid {
      display: grid;
      grid-template-rows: repeat(4, auto);
      grid-auto-flow: column;
      grid-auto-columns: 82%;
      gap: 8px 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .qp-grid::-webkit-scrollbar { display: none; }
    .qp-item {
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 8px;
      border-radius: 12px;
      background: transparent;
      border: none;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      width: 100%;
    }
    .qp-item:active { background: var(--surface2); }
    .qp-item.playing { background: var(--accent-soft); }
    .qp-art {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--surface2);
      flex-shrink: 0;
    }
    .qp-meta { flex: 1; min-width: 0; }
    .qp-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qp-item.playing .qp-title { color: var(--accent); }
    .qp-artist { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Horizontal Square Card Carousel (Listen Again / Trending) */
    .carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .carousel::-webkit-scrollbar { display: none; }
    .card-tile {
      flex: 0 0 144px;
      background: none;
      border: none;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .card-tile img {
      width: 144px;
      height: 144px;
      border-radius: 10px;
      object-fit: cover;
      background: var(--surface2);
      display: block;
    }
    .card-tile .t1 {
      font-size: 14px;
      font-weight: 600;
      margin-top: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-tile .t2 {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Search & Library & Settings */
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px 8px 4px 14px;
      margin-bottom: 14px;
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 15px;
      padding: 9px 0;
      outline: none;
    }
    .crimson-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .list-col { display: flex; flex-direction: column; gap: 6px; }

    /* Floating Mini Player — sits above floating capsule bottom bar */
    .mini-player {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: calc(env(safe-area-inset-bottom, 10px) + 76px);
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
      z-index: 20;
    }
    .mini-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
    }
    .mini-art {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--surface3);
      flex-shrink: 0;
    }
    .mini-info { flex: 1; min-width: 0; cursor: pointer; }
    .mini-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-artist { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-ctrl {
      background: none;
      border: none;
      color: var(--text);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .mini-ctrl svg { width: 22px; height: 22px; fill: currentColor; }
    .mini-progress-bg { height: 2.5px; background: rgba(255,255,255,0.1); width: 100%; }
    .mini-progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s linear; }

    /* Floating Capsule + Separate Round Search FAB — EXACT 1-to-1 AppBottomNavigationBar.kt */
    .bottom-nav-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 10px) + 6px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 16px;
      z-index: 25;
      pointer-events: none;
    }
    .nav-capsule {
      pointer-events: auto;
      height: 60px;
      padding: 4px;
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.13);
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
    }
    .nav-tab {
      height: 52px;
      min-width: 92px;
      padding: 0 16px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
    }
    .nav-tab svg { width: 21px; height: 21px; fill: currentColor; }
    .nav-tab.active {
      background: rgba(255, 255, 255, 0.11);
      color: var(--accent);
    }
    .search-fab {
      pointer-events: auto;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--glass);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.13);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
    }
    .search-fab svg { width: 22px; height: 22px; fill: currentColor; }
    .search-fab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Fullscreen Now Playing — Apple Music / SimpMusic artwork scrim */
    .modal {
      position: fixed;
      inset: 0;
      background: #0a0a0c;
      z-index: 60;
      display: none;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      overflow: hidden;
    }
    .modal.open { display: flex; }
    .modal-bg {
      position: absolute;
      inset: -40px;
      background-size: cover;
      background-position: center;
      filter: blur(55px) brightness(0.42) saturate(1.4);
      z-index: 0;
    }
    .modal-inner {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top, 10px) + 12px) 22px calc(env(safe-area-inset-bottom, 12px) + 18px);
      overflow-y: auto;
    }
    .np-art {
      width: 100%;
      max-width: 310px;
      aspect-ratio: 1;
      border-radius: 14px;
      margin: 18px auto 22px;
      object-fit: cover;
      background: var(--surface2);
      box-shadow: 0 24px 60px rgba(0,0,0,0.65);
    }
    .np-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .np-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .np-artist { font-size: 15px; color: rgba(255,255,255,0.72); margin-top: 3px; }
    .heart-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: #fff;
      font-size: 19px;
      cursor: pointer;
    }
    .heart-btn.liked { color: var(--accent); background: var(--accent-soft); }
    .seek-wrap { margin: 18px 0 10px; }
    .seek-wrap input[type=range] { width: 100%; accent-color: #ffffff; }
    .time-row { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,0.65); margin-top: 4px; }
    .np-controls { display: flex; align-items: center; justify-content: center; gap: 32px; margin: 12px 0 18px; }
    .play-big {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: none;
      background: #ffffff;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .play-big svg { width: 30px; height: 30px; fill: currentColor; }
    .ab-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .glass-pill {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.14);
      color: #fff;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .glass-pill.active { background: var(--accent); border-color: var(--accent); }
    .toast {
      position: fixed;
      top: calc(env(safe-area-inset-top, 10px) + 58px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(250, 35, 59, 0.96);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 120;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="greeting-wrap">
        <span class="greeting-sub" id="greetingSub">Good evening</span>
        <span class="greeting-title" id="headerTitle">SimpMusic</span>
      </div>
      <div class="top-icons">
        <button class="jarvis-orb" id="jarvisOrb" title="Hey Jarvis">
          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        </button>
        <button class="icon-circle" id="btnSettingsTop" title="Settings">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
        </button>
      </div>
    </header>

    <main class="content" id="mainContent"></main>

    <!-- Floating Mini Player -->
    <div class="mini-player" id="miniPlayer">
      <div class="mini-row">
        <img class="mini-art" id="miniArt" alt="" />
        <div class="mini-info" id="btnExpandPlayer">
          <div class="mini-title" id="miniTitle">Loading…</div>
          <div class="mini-artist" id="miniArtist">SimpMusic</div>
        </div>
        <button class="mini-ctrl" id="btnMiniPlay" aria-label="Play or Pause">
          <svg id="miniPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="mini-ctrl" id="btnMiniNext" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <div class="mini-progress-bg"><div class="mini-progress-fill" id="miniProg"></div></div>
    </div>

    <!-- Floating Capsule + Separate Round Search FAB (1-to-1 AppBottomNavigationBar.kt) -->
    <div class="bottom-nav-wrap">
      <div class="nav-capsule">
        <button class="nav-tab active" data-tab="home">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-tab" data-tab="library">
          <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
          <span>Library</span>
        </button>
      </div>
      <button class="search-fab" id="btnSearchFab" data-tab="search" aria-label="Search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
  </div>

  <!-- Fullscreen Now Playing -->
  <div class="modal" id="nowPlayingModal">
    <div class="modal-bg" id="modalBg"></div>
    <div class="modal-inner">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <button class="glass-pill" id="btnCloseNP">⌄</button>
        <span style="font-size:12px;font-weight:700;letter-spacing:0.1em;color:rgba(255,255,255,0.75);">NOW PLAYING</span>
        <button class="glass-pill" id="btnToggleLyrics">Lyrics</button>
      </div>
      <img class="np-art" id="npArt" alt="" />
      <div class="np-title-row">
        <div style="min-width:0;flex:1;">
          <div class="np-title" id="npTitle">Track</div>
          <div class="np-artist" id="npArtist">Artist</div>
        </div>
        <button class="heart-btn" id="btnHeart">♥</button>
      </div>
      <div class="seek-wrap">
        <input type="range" id="seekSlider" min="0" max="100" value="0" />
        <div class="time-row"><span id="timeCur">0:00</span><span id="timeTot">0:30</span></div>
      </div>
      <div class="np-controls">
        <button class="mini-ctrl" id="btnNPPrev" style="width:44px;height:44px;"><svg viewBox="0 0 24 24" style="width:30px;height:30px;"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button class="play-big" id="btnNPPlay"><svg id="npPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="mini-ctrl" id="btnNPNext" style="width:44px;height:44px;"><svg viewBox="0 0 24 24" style="width:30px;height:30px;"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      </div>
      <div class="ab-row">
        <button class="glass-pill" id="btnSetA">Set A</button>
        <button class="glass-pill" id="btnSetB">Set B</button>
        <button class="glass-pill" id="btnClearAB">Clear A–B</button>
        <span id="abStatus" style="font-size:12px;color:#fff;font-weight:700;align-self:center;"></span>
      </div>
      <div id="lyricsBox" class="panel" style="display:none;background:rgba(0,0,0,0.4);border-color:rgba(255,255,255,0.12);white-space:pre-line;font-size:16px;font-weight:600;line-height:1.75;color:#fff;"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <audio id="audio" preload="auto" playsinline></audio>

  <script>
    const PLAY_SVG = '<path d="M8 5v14l11-7z"/>';
    const PAUSE_SVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    const audio = document.getElementById("audio");
    const mainContent = document.getElementById("mainContent");
    const toastEl = document.getElementById("toast");

    const h = new Date().getHours();
    document.getElementById("greetingSub").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";

    const state = {
      tab: "home",
      mood: "All",
      quickPicks: [],
      listenAgain: [],
      queue: [],
      index: 0,
      isPlaying: false,
      likedIds: new Set(JSON.parse(localStorage.getItem("simpmusic_liked") || "[]")),
      pointA: null,
      pointB: null,
      searchQuery: "",
      searchResults: [],
      playlists: JSON.parse(localStorage.getItem("simpmusic_playlists") || "null") || [
        { id: "liked", name: "Liked Songs", source: "Local" },
        { id: "downloaded", name: "Downloaded", source: "Local" }
      ]
    };

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2400);
    }

    function fmtTime(s) {
      if (!isFinite(s) || s < 0) return "0:00";
      const m = Math.floor(s / 60);
      const r = Math.floor(s % 60);
      return `${m}:${r < 10 ? "0" : ""}${r}`;
    }

    async function searchItunes(term, limit = 16) {
      const url = `https://itunes.apple.com/search?media=music&entity=song&limit=${limit}&term=${encodeURIComponent(term)}`;
      const res = await fetch(url);
      const data = await res.json();
      return (data.results || []).filter(r => r.previewUrl).map(r => ({
        id: String(r.trackId),
        title: r.trackName,
        artist: r.artistName,
        album: r.collectionName || "",
        artwork: (r.artworkUrl100 || "").replace("100x100", "400x400"),
        url: r.previewUrl,
        duration: Math.round((r.trackTimeMillis || 30000) / 1000)
      }));
    }

    function currentTrack() { return state.queue[state.index] || null; }

    function playTrack(track, newQueue = null) {
      if (newQueue) {
        state.queue = newQueue;
        state.index = Math.max(0, newQueue.findIndex(t => t.id === track.id));
      }
      state.pointA = null;
      state.pointB = null;
      updateABStatus();
      audio.src = track.url;
      audio.play().catch(() => {});
      state.isPlaying = true;
      updatePlayerUI(track);
      render();
    }

    function updatePlayerUI(track) {
      if (!track) return;
      document.getElementById("miniTitle").textContent = track.title;
      document.getElementById("miniArtist").textContent = track.artist;
      document.getElementById("miniArt").src = track.artwork;
      document.getElementById("npTitle").textContent = track.title;
      document.getElementById("npArtist").textContent = `${track.artist}${track.album ? " · " + track.album : ""}`;
      document.getElementById("npArt").src = track.artwork;
      document.getElementById("modalBg").style.backgroundImage = `url('${track.artwork}')`;
      document.getElementById("miniPlayIcon").innerHTML = state.isPlaying ? PAUSE_SVG : PLAY_SVG;
      document.getElementById("npPlayIcon").innerHTML = state.isPlaying ? PAUSE_SVG : PLAY_SVG;
      document.getElementById("btnHeart").classList.toggle("liked", state.likedIds.has(track.id));
      document.getElementById("lyricsBox").textContent =
        `${track.title}\n${track.artist}\n\nStreaming live via SimpMusic Hey Jarvis\nBackground audio & A–B Loop ready`;
    }

    function togglePlay() {
      if (!audio.src && state.queue.length) { playTrack(state.queue[0]); return; }
      if (audio.paused) { audio.play().catch(() => {}); state.isPlaying = true; }
      else { audio.pause(); state.isPlaying = false; }
      updatePlayerUI(currentTrack());
    }

    function nextTrack() {
      if (!state.queue.length) return;
      state.index = (state.index + 1) % state.queue.length;
      playTrack(state.queue[state.index]);
    }

    function prevTrack() {
      if (!state.queue.length) return;
      state.index = (state.index - 1 + state.queue.length) % state.queue.length;
      playTrack(state.queue[state.index]);
    }

    function updateABStatus() {
      const el = document.getElementById("abStatus");
      if (state.pointA != null && state.pointB != null) el.textContent = `A–B ${fmtTime(state.pointA)} → ${fmtTime(state.pointB)}`;
      else if (state.pointA != null) el.textContent = `A ${fmtTime(state.pointA)}`;
      else el.textContent = "";
    }

    audio.addEventListener("timeupdate", () => {
      const cur = audio.currentTime || 0;
      const dur = audio.duration || 30;
      if (state.pointA != null && state.pointB != null && cur >= state.pointB) audio.currentTime = state.pointA;
      const pct = Math.min(100, (cur / dur) * 100);
      document.getElementById("seekSlider").value = pct;
      document.getElementById("miniProg").style.width = pct + "%";
      document.getElementById("timeCur").textContent = fmtTime(cur);
      document.getElementById("timeTot").textContent = fmtTime(dur);
    });
    audio.addEventListener("ended", nextTrack);

    async function runJarvisCommand(text) {
      const q = text.toLowerCase().trim();
      if (q.includes("pause") || q.includes("stop")) {
        audio.pause(); state.isPlaying = false; updatePlayerUI(currentTrack()); showToast("Jarvis: Paused");
      } else if (q.includes("next") || q.includes("skip")) {
        nextTrack(); showToast("Jarvis: Next song");
      } else {
        const clean = q.replace(/^(hey|hi|ok|yo)\s+jarvis\s*/i, "").replace(/^play\s+/i, "").trim() || "smooth jazz";
        showToast(`Jarvis: Playing ${clean}…`);
        const tracks = await searchItunes(clean, 12);
        if (tracks.length) { state.quickPicks = tracks; playTrack(tracks[0], tracks); }
      }
    }

    function render() {
      document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("active", b.dataset.tab === state.tab));
      const titleMap = { home: "SimpMusic", library: "Library", search: "Search", settings: "Settings" };
      document.getElementById("headerTitle").textContent = titleMap[state.tab] || "SimpMusic";
      const cur = currentTrack();

      if (state.tab === "home") {
        const moods = ["All", "Energize", "Feel good", "Focus", "Party", "Relax", "Romance", "Sad", "Sleep", "Workout", "Commute"];
        mainContent.innerHTML = `
          <div class="chips">${moods.map(m => `<button class="chip ${state.mood === m ? "active" : ""}" data-mood="${m}">${m}</button>`).join("")}</div>
          <div class="sec-head">
            <div><div class="sec-sub">Start radio from a song</div><div class="sec-title">Quick picks</div></div>
            <button class="sec-btn" id="btnPlayAllQP">Play all</button>
          </div>
          <div class="qp-grid">
            ${state.quickPicks.map(t => `
              <button class="qp-item ${cur && cur.id === t.id ? "playing" : ""}" data-qp="${t.id}">
                <img class="qp-art" src="${t.artwork}" alt="" />
                <div class="qp-meta">
                  <div class="qp-title">${t.title}</div>
                  <div class="qp-artist">${t.artist}</div>
                </div>
              </button>`).join("")}
          </div>
          <div class="sec-head">
            <div><div class="sec-sub">Your favorites</div><div class="sec-title">Listen again</div></div>
          </div>
          <div class="carousel">
            ${state.listenAgain.map(t => `
              <button class="card-tile" data-la="${t.id}">
                <img src="${t.artwork}" alt="" />
                <div class="t1">${t.title}</div>
                <div class="t2">${t.artist}</div>
              </button>`).join("")}
          </div>
        `;
        mainContent.querySelectorAll("[data-mood]").forEach(btn => btn.onclick = async () => {
          state.mood = btn.dataset.mood;
          render();
          const q = state.mood === "All" ? "Top Hits 2025" : state.mood + " music";
          state.quickPicks = await searchItunes(q, 16);
          render();
        });
        document.getElementById("btnPlayAllQP").onclick = () => { if (state.quickPicks.length) playTrack(state.quickPicks[0], state.quickPicks); };
        mainContent.querySelectorAll("[data-qp]").forEach(b => b.onclick = () => {
          const t = state.quickPicks.find(x => x.id === b.dataset.qp);
          if (t) playTrack(t, state.quickPicks);
        });
        mainContent.querySelectorAll("[data-la]").forEach(b => b.onclick = () => {
          const t = state.listenAgain.find(x => x.id === b.dataset.la);
          if (t) playTrack(t, state.listenAgain);
        });
      } else if (state.tab === "search") {
        mainContent.innerHTML = `
          <div class="search-box">
            <input id="searchInput" type="search" placeholder="Search songs, artists, albums…" value="${state.searchQuery}" />
            <button class="crimson-btn" id="btnSearchGo">Search</button>
          </div>
          <div class="list-col">
            ${state.searchResults.map(t => `
              <button class="qp-item ${cur && cur.id === t.id ? "playing" : ""}" data-sr="${t.id}">
                <img class="qp-art" src="${t.artwork}" alt="" />
                <div class="qp-meta">
                  <div class="qp-title">${t.title}</div>
                  <div class="qp-artist">${t.artist} · ${fmtTime(t.duration)}</div>
                </div>
              </button>`).join("") || `<div class="panel" style="color:var(--muted);">Search any song, artist, or album on SimpMusic.</div>`}
          </div>
        `;
        const doSearch = async () => {
          state.searchQuery = document.getElementById("searchInput").value.trim();
          if (!state.searchQuery) return;
          state.searchResults = await searchItunes(state.searchQuery, 15);
          render();
        };
        document.getElementById("btnSearchGo").onclick = doSearch;
        document.getElementById("searchInput").onkeydown = e => { if (e.key === "Enter") doSearch(); };
        mainContent.querySelectorAll("[data-sr]").forEach(b => b.onclick = () => {
          const t = state.searchResults.find(x => x.id === b.dataset.sr);
          if (t) playTrack(t, state.searchResults);
        });
      } else if (state.tab === "library") {
        mainContent.innerHTML = `
          <div class="panel">
            <div style="font-size:15px;font-weight:700;margin-bottom:4px;">Import Spotify / YouTube Link</div>
            <div style="font-size:12px;color:var(--muted);margin-bottom:10px;">Paste any public playlist link to add it to your Library.</div>
            <div class="search-box" style="margin-bottom:0;">
              <input id="importUrlInput" placeholder="https://open.spotify.com/playlist/..." />
              <button class="crimson-btn" id="btnImportDo">Import</button>
            </div>
          </div>
          <div class="sec-head"><div class="sec-title">Your Playlists</div></div>
          <div class="list-col">
            ${state.playlists.map(p => `
              <div class="qp-item" style="cursor:default;">
                <div class="qp-art" style="display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent);">♥</div>
                <div class="qp-meta">
                  <div class="qp-title">${p.name}</div>
                  <div class="qp-artist">${p.source}</div>
                </div>
                <button class="crimson-btn" data-play-pl="${p.id}">Play</button>
              </div>`).join("")}
          </div>
        `;
        document.getElementById("btnImportDo").onclick = () => {
          const val = document.getElementById("importUrlInput").value.trim();
          if (!val) return;
          state.playlists.unshift({ id: "pl_" + Date.now(), name: val.includes("spotify") ? "Spotify Playlist" : "Imported Playlist", source: val.slice(0, 34) + "…" });
          localStorage.setItem("simpmusic_playlists", JSON.stringify(state.playlists));
          showToast("Playlist imported");
          render();
        };
        mainContent.querySelectorAll("[data-play-pl]").forEach(b => b.onclick = () => { if (state.quickPicks.length) playTrack(state.quickPicks[0], state.quickPicks); });
      } else if (state.tab === "settings") {
        mainContent.innerHTML = `
          <div class="panel">
            <div style="font-size:12px;font-weight:800;color:var(--accent);letter-spacing:0.08em;">HEY JARVIS VOICE ASSISTANT</div>
            <p style="font-size:13px;color:var(--muted);margin:8px 0 12px;">Tap the glowing mic button in the top bar or test a voice command:</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="sec-btn" id="btnTestJazz">Play Smooth Jazz</button>
              <button class="sec-btn" id="btnTestNext">Next Song</button>
              <button class="sec-btn" id="btnTestPause">Pause</button>
            </div>
          </div>
          <div class="panel">
            <div style="font-size:15px;font-weight:700;">SimpMusic · Hey Jarvis Edition</div>
            <div style="font-size:12px;color:var(--muted);margin-top:4px;">v2.6.13 · Apple Music Crimson UI (1-to-1 with Android)</div>
          </div>
        `;
        document.getElementById("btnTestJazz").onclick = () => runJarvisCommand("Hey Jarvis play smooth jazz");
        document.getElementById("btnTestNext").onclick = () => runJarvisCommand("Hey Jarvis next song");
        document.getElementById("btnTestPause").onclick = () => runJarvisCommand("Hey Jarvis pause");
      }
    }

    // Wire events
    document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
    document.getElementById("btnSettingsTop").onclick = () => { state.tab = state.tab === "settings" ? "home" : "settings"; render(); };
    document.getElementById("btnMiniPlay").onclick = togglePlay;
    document.getElementById("btnMiniNext").onclick = nextTrack;
    document.getElementById("btnNPPlay").onclick = togglePlay;
    document.getElementById("btnNPNext").onclick = nextTrack;
    document.getElementById("btnNPPrev").onclick = prevTrack;
    document.getElementById("btnExpandPlayer").onclick = () => document.getElementById("nowPlayingModal").classList.add("open");
    document.getElementById("btnCloseNP").onclick = () => document.getElementById("nowPlayingModal").classList.remove("open");
    document.getElementById("btnToggleLyrics").onclick = () => {
      const box = document.getElementById("lyricsBox");
      box.style.display = box.style.display === "none" ? "block" : "none";
    };
    document.getElementById("btnHeart").onclick = () => {
      const t = currentTrack();
      if (!t) return;
      if (state.likedIds.has(t.id)) state.likedIds.delete(t.id); else state.likedIds.add(t.id);
      localStorage.setItem("simpmusic_liked", JSON.stringify([...state.likedIds]));
      updatePlayerUI(t);
    };
    document.getElementById("seekSlider").oninput = e => { audio.currentTime = (e.target.value / 100) * (audio.duration || 30); };
    document.getElementById("btnSetA").onclick = () => { state.pointA = audio.currentTime || 0; updateABStatus(); showToast("Loop A set"); };
    document.getElementById("btnSetB").onclick = () => { state.pointB = Math.max((state.pointA || 0) + 1, audio.currentTime || 5); updateABStatus(); showToast("A–B Loop Active"); };
    document.getElementById("btnClearAB").onclick = () => { state.pointA = null; state.pointB = null; updateABStatus(); showToast("A–B Loop cleared"); };

    document.getElementById("jarvisOrb").onclick = () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        const cmd = prompt('Hey Jarvis command (e.g. "play lo-fi", "next song"):');
        if (cmd) runJarvisCommand(cmd);
        return;
      }
      const orb = document.getElementById("jarvisOrb");
      const rec = new SR();
      rec.lang = "en-US";
      orb.classList.add("listening");
      showToast("Listening…");
      rec.onresult = e => { orb.classList.remove("listening"); runJarvisCommand(e.results[0][0].transcript); };
      rec.onerror = () => orb.classList.remove("listening");
      rec.onend = () => orb.classList.remove("listening");
      rec.start();
    };

    (async () => {
      render();
      try {
        const [qp, la] = await Promise.all([searchItunes("The Weeknd", 16), searchItunes("Daft Punk", 10)]);
        state.quickPicks = qp;
        state.listenAgain = la;
        state.queue = qp;
        if (qp.length) updatePlayerUI(qp[0]);
      } catch (e) {}
      render();
    })();
  </script>
</body>
</html>
